<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logi Web 設定工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：頂列 → 首頁裝置卡片；進入裝置後為「圖示欄 + 側欄 + 主舞台」三欄，參考遊戲周邊軟體的深色控制台 */
:root{
  color-scheme: dark;
  --bg:#08090b; --panel:#1d1f23; --panel-2:#26292e; --raise:#30343a; --line:#2f3238;
  --fg:#eef0f3; --mut:#8d939c; --dim:#5d636b;
  --acc:#2a9df4; --acc-ink:#04131f; --acc-weak:#12263a;
  --ok:#2fbf71; --warn:#e3a008; --err:#f0524a;
  --display:"Barlow Semi Condensed","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--body);display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* 頂列 */
.top{display:flex;align-items:center;gap:16px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:700 20px/1 var(--display);letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:var(--acc-ink);font-style:normal;font-size:15px}
.top .sp{flex:1}
.status{color:var(--mut);font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 16px;border-radius:10px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--fg)}
.icon-btn:hover{background:var(--panel)}
.icon-btn svg{width:22px;height:22px}

#app{flex:1;min-height:0;display:flex;flex-direction:column}
#notices{padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.notice{max-width:760px;margin:16px auto 0;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;font-size:14px}
.notice.err{border-left-color:var(--err)}
code{font-family:var(--mono);background:var(--panel-2);padding:1px 6px;border-radius:5px;font-size:12.5px}

/* 首頁 */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.home-grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.devcard{width:300px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px 18px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.devcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.devcard h3{margin:0;font:700 24px/1.15 var(--display);letter-spacing:.01em;text-wrap:balance}
.devcard .meta{display:flex;align-items:center;gap:10px;color:var(--mut);font:600 15px var(--display)}
.devcard .meta svg{width:22px;height:12px}
.devcard .art{height:250px;display:grid;place-items:center}
.devcard .art svg{height:100%;max-width:100%}
.devcard .foot{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12.5px}
.empty-hero{max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-hero h2{margin:0;font:700 30px/1.2 var(--display);text-wrap:balance}
.empty-hero p{margin:0;color:var(--mut)}
.empty-hero .art{height:220px;opacity:.55}
.empty-hero .art svg{height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font-size:12.5px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:3px 10px}

/* 裝置頁 */
.devhead{display:flex;align-items:center;gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.devhead h1{margin:0;font:700 clamp(24px,4vw,36px)/1.1 var(--display);letter-spacing:.01em;flex:1;min-width:0;text-wrap:balance}
.batt{display:inline-flex;align-items:center;gap:6px;font:600 15px var(--display);color:var(--mut)}
.batt svg{width:22px;height:12px}
.devbody{flex:1;min-height:0;display:grid;grid-template-columns:72px 340px minmax(0,1fr);gap:16px;padding:0 max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.rail{display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:4px}
.rail .sp{flex:1}
.rail button{width:56px;height:56px;border-radius:14px;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;position:relative}
.rail button:hover{background:var(--panel)}
.rail button.on{background:var(--acc);color:#fff}
.rail button svg{width:26px;height:26px}
.rail button span{position:absolute;left:64px;white-space:nowrap;background:var(--raise);padding:3px 8px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
.rail button:hover span{opacity:1}
.side{background:var(--panel);border-radius:16px;padding:22px 22px;overflow:auto;min-width:0}
.side h2{margin:0 0 6px;font:700 26px/1.2 var(--display)}
.side p{color:var(--mut);font-size:14px;margin:8px 0}
.side .group{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;display:flex;flex-direction:column;gap:10px}
.side .label{font-size:13px;font-weight:700;letter-spacing:.04em}
.stage{min-width:0;overflow:auto;padding:4px 4px 8px}
.stage.full{grid-column:2/-1}
.stage h2{margin:0;font:700 24px/1.2 var(--display)}
.stagehead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.readout{color:var(--mut);font-size:14px}
.readout b{font:700 26px var(--display);color:var(--fg);font-variant-numeric:tabular-nums;margin:0 4px}
.cols{display:grid;grid-template-columns:6px 34px minmax(80px,1fr) 120px 64px;gap:14px;align-items:center;padding:0 14px;color:var(--mut);font-size:13px}
.stagerow{display:grid;grid-template-columns:6px 34px minmax(80px,1fr) 120px 64px;gap:14px;align-items:center;padding:14px;border-radius:12px;margin:6px 0;transition:background .15s}
.stagerow.active{background:var(--acc-weak)}
.stagerow .bar{width:4px;height:40px;border-radius:2px;background:var(--raise)}
.stagerow.active .bar{background:#fff}
.stagerow .num{font:600 20px var(--display);color:var(--mut);background:none;border:0;padding:0;text-align:left}
.stagerow.active .num{color:var(--fg)}
.stagerow.off .num,.stagerow.off input[type=number]{color:var(--dim)}
input[type=range]{width:100%;accent-color:var(--acc);background:transparent}
.stagerow.off input[type=range]{accent-color:var(--dim)}
input[type=number],select,.field{background:transparent;border:1px solid var(--raise);border-radius:10px;padding:9px 12px;font:600 18px var(--display);width:100%;font-variant-numeric:tabular-nums}
select{font:500 15px var(--body);background:var(--panel)}
select option{background:var(--panel)}
.sw{position:relative;display:inline-block;width:52px;height:30px}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--raise);transition:background .15s;pointer-events:none}
.sw i::after{content:"";position:absolute;width:22px;height:22px;left:4px;top:4px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{transform:translateX(22px)}
.sw input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
.sw input:disabled+i{opacity:.5}
.subsec{margin-top:26px;display:flex;flex-direction:column;gap:10px;max-width:360px}
.subsec .label{font-size:16px;font-weight:700}
.hint{color:var(--mut);font-size:13px}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.okbox{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--mut)} .kv dd{margin:0;word-break:break-word}
.btnlist{display:flex;flex-direction:column;gap:2px}
.btnlist button{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:0;background:transparent;text-align:left}
.btnlist button:hover,.btnlist button.on{background:var(--panel-2)}
.btnlist small{color:var(--mut)}
.mousebox{display:grid;place-items:center;padding:10px 0}
.mousebox svg{width:100%;max-width:640px;height:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 10px;font:700 18px var(--display);display:flex;justify-content:space-between;gap:8px}
.card h3 small{font:400 12px var(--mono);color:var(--dim)}
.card.wide{grid-column:1/-1}
.big{font:700 34px/1.1 var(--display);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:var(--raise);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--panel-2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;color:var(--mut)}
.seg button.on{background:var(--raise);color:var(--fg);font-weight:700}
.tablewrap{max-height:340px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;position:sticky;top:0;background:var(--panel)}
.mono{font-family:var(--mono)}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--acc-weak);color:var(--acc)}

/* 紀錄抽屜 */
.drawer{border-top:1px solid var(--line);background:var(--panel)}
.drawer header{display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));font-size:13px;color:var(--mut)}
.drawer header .sp{flex:1}
#log{margin:0;height:200px;overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all}
.l-err{color:var(--err)} .l-ok{color:var(--ok)} .l-tx{color:var(--dim)} .l-rx{color:var(--acc)} .l-ev{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;box-shadow:0 8px 30px #0008;max-width:calc(100% - 32px)}
.toast.err{border-color:var(--err)}

@media (max-width: 980px){
  .devbody{grid-template-columns:1fr;gap:12px}
  .rail{flex-direction:row;justify-content:flex-start;overflow-x:auto;padding:0}
  .rail .sp{display:none}
  .rail button span{display:none}
  .side{max-height:none;overflow:visible}
  .devbody{flex:none}
  #app{flex:none}
  .stage.full{grid-column:auto}
}
@media (max-width: 560px){
  .cols{display:none}
  .top .status{display:none}
  .stagerow{grid-template-columns:4px 26px 1fr 58px;gap:10px;padding:12px 10px}
  .stagerow input[type=range]{grid-column:2/-1;grid-row:2}
  .stagerow .bar{grid-row:1/3;height:100%}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><i>L</i>LOGI WEB</div>
  <span class="sp"></span>
  <span class="status" id="status">未連線</span>
  <button class="btn primary" id="btnConnect">連線裝置</button>
  <button class="btn ghost" id="btnDisconnect" disabled>中斷</button>
  <button class="icon-btn" id="btnLog" title="通訊紀錄" aria-label="通訊紀錄"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
</div>
<div id="notices"></div>
<div id="app"></div>
<div class="drawer" id="drawer" hidden>
  <header><b style="color:var(--fg)">通訊紀錄</b><span class="sp"></span><label><input type="checkbox" id="chkRaw"> 顯示原始封包</label><button class="btn sm" id="btnClearLog">清除</button></header>
  <pre id="log"></pre>
</div>
<script>
'use strict';
// ───────────────────────── 常數 ─────────────────────────
const LOGI_VID = 0x046d;
const HID_FILTERS = [
  { vendorId: LOGI_VID, usagePage: 0xff00 },  // HID++ (USB / 接收器)
  { vendorId: LOGI_VID, usagePage: 0xff43 },  // HID++ (藍牙 / 新款裝置)
];
const RECEIVER_PIDS = new Set([0xc52b, 0xc532, 0xc534, 0xc539, 0xc53a, 0xc53f, 0xc541, 0xc545, 0xc547, 0xc548, 0xc54d]);
const REPORT_SHORT = 0x10, REPORT_LONG = 0x11;

const F = {
  ROOT: 0x0000, FEATURE_SET: 0x0001, FW_VERSION: 0x0003, NAME_TYPE: 0x0005,
  BATTERY_STATUS: 0x1000, BATTERY_VOLTAGE: 0x1001, UNIFIED_BATTERY: 0x1004,
  CHANGE_HOST: 0x1814, REPROG_V4: 0x1b04,
  SMART_SHIFT: 0x2110, SMART_SHIFT_ENH: 0x2111, HIRES_WHEEL: 0x2121,
  ADJ_DPI: 0x2201, EXT_DPI: 0x2202, REPORT_RATE: 0x8060, EXT_REPORT_RATE: 0x8061, ONBOARD_PROFILES: 0x8100,
};
const FEATURE_NAMES = {
  0x0000:'Root',0x0001:'FeatureSet',0x0002:'FeatureInfo',0x0003:'DeviceFwVersion',0x0004:'DeviceUnitId',
  0x0005:'DeviceNameType',0x0006:'DeviceGroups',0x0007:'DeviceFriendlyName',0x0008:'KeepAlive',
  0x0020:'ConfigChange',0x0021:'CryptoId',0x00c2:'DFUControl',0x00c3:'DFUControlSigned',0x00d0:'DFU',
  0x1000:'BatteryStatus',0x1001:'BatteryVoltage',0x1004:'UnifiedBattery',0x1010:'ChargingControl',
  0x1300:'LEDControl',0x1802:'DeviceReset',0x1803:'GPIOAccess',0x1806:'ConfigurableDeviceProperties',
  0x1814:'ChangeHost',0x1815:'HostsInfo',0x1981:'Backlight',0x1982:'Backlight2',0x1983:'Backlight3',
  0x1990:'Illumination',0x1a00:'PresenterControl',0x1b00:'ReprogControls',0x1b04:'ReprogControlsV4',
  0x1bc0:'PersistentRemappableAction',0x1d4b:'WirelessDeviceStatus',0x1df3:'EquadDJDebugInfo',
  0x1e00:'EnableHiddenFeatures',0x1f20:'ADCMeasurement',0x2001:'SwapLeftRightButton',
  0x2100:'VerticalScrolling',0x2110:'SmartShift',0x2111:'SmartShiftEnhanced',0x2120:'HiResScrolling',
  0x2121:'HiResWheel',0x2130:'LowResWheel',0x2150:'Thumbwheel',0x2200:'MousePointer',
  0x2201:'AdjustableDPI',0x2202:'ExtendedAdjustableDPI',0x2205:'PointerSpeed',0x2230:'AngleSnapping',
  0x2240:'SurfaceTuning',0x2250:'XYStats',0x40a0:'FnInversion',0x40a2:'FnInversion2',0x40a3:'FnInversion3',
  0x4100:'Encryption',0x4220:'LockKeyState',0x4301:'SolarDashboard',0x4520:'KeyboardLayout',
  0x4521:'DisableKeys',0x4522:'DisableKeysByUsage',0x4530:'DualPlatform',0x4531:'MultiPlatform',
  0x4540:'KeyboardInternationalLayouts',0x4600:'Crown',0x6010:'TouchpadFwItems',0x6100:'TouchpadRawXY',
  0x6500:'Gestures2',0x6501:'Gestures',0x8010:'GKey',0x8020:'MKeys',0x8030:'MR',0x8040:'BrightnessControl',
  0x8060:'AdjustableReportRate',0x8061:'ExtendedAdjustableReportRate',0x8070:'ColorLEDEffects',
  0x8071:'RGBEffects',0x8080:'PerKeyLighting',0x8081:'PerKeyLightingV2',0x8090:'ModeStatus',
  0x8100:'OnboardProfiles',0x8110:'MouseButtonSpy',0x8111:'LatencyMonitoring',0x8120:'GamingAttachments',
  0x8123:'ForceFeedback',0x8300:'Sidetone',0x8310:'Equalizer',0x8320:'HeadsetOut',
};
const DEVICE_TYPES = ['鍵盤','遙控器','數字鍵盤','滑鼠','觸控板','軌跡球','簡報器','接收器','耳機','網路攝影機',
  '方向盤','搖桿','遊戲手把','擴充座','喇叭','麥克風','照明燈','可程式控制器','踏板','轉接器'];
const FW_TYPES = ['主程式','Bootloader','硬體','觸控板','光學感測器','軟體套件','RF 韌體'];
const ERR20 = ['無錯誤','未知錯誤','參數無效','超出範圍','硬體錯誤','Logitech 內部錯誤','Feature 索引無效','Function 無效','裝置忙碌','不支援'];
const ERR10 = {1:'SubID 無效',2:'位址無效',3:'數值無效',4:'連線失敗',5:'裝置過多',6:'已存在',7:'忙碌',
  8:'未知裝置',9:'裝置未回應（可能休眠或未配對）',10:'請求無法使用',11:'參數值無效',12:'PIN 錯誤'};
const CID_NAMES = {0x50:'左鍵',0x51:'右鍵',0x52:'中鍵',0x53:'上一頁',0x56:'下一頁',0x5b:'滾輪左傾',0x5d:'滾輪右傾',
  0xc3:'手勢鍵',0xc4:'SmartShift 切換',0xd7:'切換接收器',0xfd:'DPI 切換',0x1a0:'DPI 加',0x1a1:'DPI 減',
  0xed:'DPI 循環',0x01:'音量加',0x02:'音量減',0x03:'靜音',0x04:'播放/暫停',0xdd:'Easy-Switch 1',0xde:'Easy-Switch 2',0xdf:'Easy-Switch 3'};

// ───────────────────────── 小工具 ─────────────────────────
const $ = (s, el = document) => el.querySelector(s);
const hx = (n, w = 2) => n.toString(16).toUpperCase().padStart(w, '0');
const bytesHex = (u8) => Array.from(u8, b => hx(b)).join(' ');
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'value' || k === 'disabled') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}
const logEl = $('#log');
function log(msg, cls = '') {
  if ((cls === 'l-tx' || cls === 'l-rx') && !$('#chkRaw').checked) return;
  const t = new Date().toLocaleTimeString('zh-TW', { hour12: false });
  logEl.append(h('div', { class: cls }, `[${t}] ${msg}`));
  while (logEl.childElementCount > 400) logEl.firstChild.remove();
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(s) { $('#status').textContent = s; }
function notice(html, kind = '') {
  const n = h('div', { class: 'notice ' + kind });
  n.innerHTML = html;
  $('#notices').append(n);
}

// ───────────────────────── HID++ 傳輸層 ─────────────────────────
class HidppError extends Error {
  constructor(kind, code, msg) { super(msg); this.kind = kind; this.code = code; }
}

class HidppTransport {
  constructor(hid) {
    this.hid = hid;
    this.pending = null;
    this.queue = Promise.resolve();
    this.sw = 0;
    this.listeners = new Set();
    const outIds = new Set();
    for (const c of hid.collections) for (const r of c.outputReports || []) outIds.add(r.reportId);
    this.hasLong = outIds.has(REPORT_LONG) || outIds.size === 0;
    this.hasShort = outIds.has(REPORT_SHORT);
    this._onReport = (e) => this.onReport(e);
    hid.addEventListener('inputreport', this._onReport);
  }
  close() { this.hid.removeEventListener('inputreport', this._onReport); }

  onReport(e) {
    if (e.reportId !== REPORT_SHORT && e.reportId !== REPORT_LONG && e.reportId !== 0x12) return;
    const d = new Uint8Array(e.data.buffer, e.data.byteOffset, e.data.byteLength);
    log(`RX ${hx(e.reportId)} | ${bytesHex(d)}`, 'l-rx');
    const p = this.pending;
    if (p && d[0] === p.dev) {
      if (d[1] === p.feat && d[2] === p.funcSw) return p.resolve(d.slice(3));
      if (d[1] === 0xff && d[2] === p.feat && d[3] === p.funcSw)
        return p.reject(new HidppError('hidpp20', d[4], ERR20[d[4]] || `錯誤 0x${hx(d[4])}`));
      if (d[1] === 0x8f && d[2] === p.feat && d[3] === p.funcSw)
        return p.reject(new HidppError('hidpp10', d[4], ERR10[d[4]] || `錯誤 0x${hx(d[4])}`));
    }
    for (const fn of this.listeners) fn(d, e.reportId);
  }

  // 依序送出指令（HID++ 一次只處理一個請求最穩定）
  request(dev, feat, fn, params = [], timeout = 2000) {
    const run = () => this._exec(dev, feat, fn, params, timeout);
    const p = this.queue.then(run, run);
    this.queue = p.catch(() => {});
    return p;
  }

  _exec(dev, feat, fn, params, timeout) {
    return new Promise((resolve, reject) => {
      this.sw = (this.sw % 15) + 1;
      const funcSw = ((fn & 0x0f) << 4) | this.sw;
      const useShort = !this.hasLong && params.length <= 3;
      const len = useShort ? 6 : 19;
      const data = new Uint8Array(len);
      data[0] = dev; data[1] = feat; data[2] = funcSw;
      data.set(params.slice(0, len - 3), 3);
      const p = {
        dev, feat, funcSw,
        resolve: (d) => { clearTimeout(timer); this.pending = null; resolve(d); },
        reject: (err) => { clearTimeout(timer); this.pending = null; reject(err); },
      };
      const timer = setTimeout(() => p.reject(new HidppError('timeout', 0, '逾時未回應')), timeout);
      this.pending = p;
      const rid = useShort ? REPORT_SHORT : REPORT_LONG;
      log(`TX ${hx(rid)} | ${bytesHex(data)}`, 'l-tx');
      this.hid.sendReport(rid, data).catch(err => { if (this.pending === p) p.reject(err); });
    });
  }
}

// ───────────────────────── HID++ 2.0 裝置 ─────────────────────────
class LogiDevice {
  constructor(t, index, proto) {
    this.t = t; this.index = index; this.proto = proto;
    this.featIdx = new Map();   // featureId -> index
    this.featList = [];         // {index,id,type,version}
    this.name = index === 0xff ? '裝置' : `槽位 ${index}`;
  }
  async getFeatureIndex(id) {
    if (id === F.ROOT) return 0;
    if (this.featIdx.has(id)) return this.featIdx.get(id);
    const r = await this.t.request(this.index, 0, 0, [id >> 8, id & 0xff]);
    const idx = r[0] || null;
    this.featIdx.set(id, idx);
    return idx;
  }
  has(id) { return !!this.featIdx.get(id); }
  async call(id, fn, params = [], timeout) {
    const idx = await this.getFeatureIndex(id);
    if (!idx && id !== F.ROOT) throw new HidppError('nofeature', 0, `裝置不支援 feature 0x${hx(id, 4)}`);
    return this.t.request(this.index, idx, fn, params, timeout);
  }
  async loadFeatures() {
    this.featList = [{ index: 0, id: 0, type: 0, version: 0 }];
    const fsIdx = await this.getFeatureIndex(F.FEATURE_SET);
    if (!fsIdx) return;
    const count = (await this.call(F.FEATURE_SET, 0))[0];
    for (let i = 1; i <= count; i++) {
      const r = await this.call(F.FEATURE_SET, 1, [i]);
      const id = (r[0] << 8) | r[1];
      this.featIdx.set(id, i);
      this.featList.push({ index: i, id, type: r[2], version: r[3] });
    }
  }
  async readName() {
    if (!this.has(F.NAME_TYPE)) return;
    const len = (await this.call(F.NAME_TYPE, 0))[0];
    let s = '';
    while (s.length < len) {
      const r = await this.call(F.NAME_TYPE, 1, [s.length]);
      const chunk = Array.from(r.slice(0, len - s.length)).filter(b => b).map(b => String.fromCharCode(b)).join('');
      if (!chunk) break;
      s += chunk;
    }
    if (s) this.name = s;
    try { this.type = (await this.call(F.NAME_TYPE, 2))[0]; } catch {}
  }
}


function parseDpiList(bytes) {
  const vals = [];
  for (let i = 0; i + 1 < bytes.length; i += 2) {
    const v = (bytes[i] << 8) | bytes[i + 1];
    if (!v) break;
    vals.push(v);
  }
  const list = [];
  for (let i = 0; i < vals.length; i++) {
    const v = vals[i];
    if ((v >> 13) === 7 && list.length && i + 1 < vals.length) {
      const step = v & 0x1fff, to = vals[++i];
      for (let x = list[list.length - 1] + step; x <= to && step; x += step) list.push(x);
      if (list[list.length - 1] !== to) list.push(to);
    } else list.push(v);
  }
  return list;
}

// 0x2201 AdjustableDPI 與 0x2202 ExtendedAdjustableDPI 共用同一個介面
function dpiApi(d) {
  if (d.has(F.EXT_DPI)) {
    const caps = {};
    return {
      fid: F.EXT_DPI,
      sensors: async () => (await d.call(F.EXT_DPI, 0))[0] || 1,
      async list(s) {
        const c = await d.call(F.EXT_DPI, 1, [s]);
        caps[s] = { y: !!(c[2] & 1), lod: !!(c[2] & 2) };
        let bytes = [];
        for (let page = 0; page < 32; page++) {
          const r = await d.call(F.EXT_DPI, 2, [s, 0, page]);
          bytes.push(...r.slice(3));
          if (bytes.length >= 2 && !bytes[bytes.length - 1] && !bytes[bytes.length - 2]) break;
          if (r.slice(3).every(b => !b)) break;
        }
        return parseDpiList(bytes);
      },
      async get(s) {
        const r = await d.call(F.EXT_DPI, 5, [s]);
        const x = (r[1] << 8) | r[2], defX = (r[3] << 8) | r[4];
        const y = (r[5] << 8) | r[6];
        return { cur: x || defX, def: defX, y, lod: caps[s]?.lod ? r[9] : null };
      },
      async set(s, v, lod) {
        const st = await this.get(s);
        const y = caps[s]?.y ? v : 0;
        const l = caps[s]?.lod ? (lod ?? st.lod ?? 0) : 0;
        await d.call(F.EXT_DPI, 6, [s, v >> 8, v & 0xff, y >> 8, y & 0xff, l]);
      },
      hasLod: (s) => !!caps[s]?.lod,
    };
  }
  if (d.has(F.ADJ_DPI)) {
    return {
      fid: F.ADJ_DPI,
      sensors: async () => (await d.call(F.ADJ_DPI, 0))[0] || 1,
      list: async (s) => parseDpiList((await d.call(F.ADJ_DPI, 1, [s])).slice(1)),
      async get(s) {
        const r = await d.call(F.ADJ_DPI, 2, [s]);
        const cur = (r[1] << 8) | r[2], def = (r[3] << 8) | r[4];
        return { cur: cur || def, def, lod: null };
      },
      set: (s, v) => d.call(F.ADJ_DPI, 3, [s, v >> 8, v & 0xff]),
      hasLod: () => false,
    };
  }
  return null;
}

const BTN_FUNC = ['無動作', '滾輪左傾', '滾輪右傾', '下一個 DPI', '上一個 DPI', 'DPI 循環', '預設 DPI', 'DPI Shift',

function keyName(mod, code) {
  const mods = [];
  if (mod & 0x11) mods.push('Ctrl'); if (mod & 0x22) mods.push('Shift'); if (mod & 0x44) mods.push('Alt'); if (mod & 0x88) mods.push('Win');
  let k;

  else if (code >= 30 && code <= 38) k = String(code - 29);
  else if (code === 39) k = '0';
  else if (code >= 0x3a && code <= 0x45) k = 'F' + (code - 0x39);
  else k = { 0x28: 'Enter', 0x29: 'Esc', 0x2a: 'Backspace', 0x2b: 'Tab', 0x2c: 'Space' }[code] || (code ? `鍵碼 0x${hx(code)}` : '');
  return [...mods, k].filter(Boolean).join(' + ');

    if (b[1] === 1) { const v = (b[2] << 8) | b[3]; return MOUSE_BITS[v] || `滑鼠按鍵 0x${hx(v, 4)}`; }
    if (b[1] === 2) return '鍵盤：' + keyName(b[2], b[3]);
    if (b[1] === 3) return `多媒體鍵 0x${hx((b[2] << 8) | b[3], 4)}`;
  }
  if (beh === 9) return BTN_FUNC[b[1]] ?? `功能 0x${hx(b[1])}`;
  if (beh === 0) return '巨集';
  return '其他';
}
async function readOnboard(d) {

  const blank = (c) => c.slice(0, 4).every(b => b === 0) || c.slice(0, 4).every(b => b === 0xff);

    if (c[0] === 0xff && c[1] === 0xff) break;

  }
  let cur = null;
  try { const g = await d.call(F.ONBOARD_PROFILES, 4); cur = (g[0] << 8) | g[1]; } catch {}
  const idx = cur && headers[cur - 1] ? cur - 1 : Math.max(0, headers.findIndex(x => x.enabled));
  const hd = headers[idx];
  if (!hd) return { info, supported: false };
  const bytes = [];
  for (let o = 0; o < 208 && o + 16 <= info.size; o += 16) bytes.push(...(await read(hd.sector, o)).slice(0, 16));
  const le16 = (i) => bytes[i] | (bytes[i + 1] << 8);
  const p = {
    index: idx + 1, count: headers.length, sector: hd.sector,
    reportRateMs: bytes[0], defaultIndex: bytes[1], shiftIndex: bytes[2],
    resolutions: [0, 1, 2, 3, 4].map(i => le16(3 + i * 2)),
    buttons: [], gbuttons: [], name: '',
  };
  for (let i = 0; i < info.buttons && 32 + i * 4 + 4 <= bytes.length; i++) p.buttons.push(bytes.slice(32 + i * 4, 36 + i * 4));
  for (let i = 0; i < info.gbuttons && 96 + i * 4 + 4 <= bytes.length; i++) p.gbuttons.push(bytes.slice(96 + i * 4, 100 + i * 4));
  if (bytes.length >= 208 && bytes[160] !== 0xff) {
    try { p.name = new TextDecoder('utf-16le').decode(new Uint8Array(bytes.slice(160, 208))).replace(/[\0￿]+$/g, ''); } catch {}
  }
  return { info, supported: true, profile: p };
}

async function loadAll(d) {
  const x = d.data = { sensor: 0 };
  const step = async (label, fn) => { try { await fn(); } catch (e) { log(`${label}：${e.message}`, 'l-err'); } };
  await step('電池', async () => { x.battery = await loadBattery(d); });
  x.dpiApi = dpiApi(d);
  if (x.dpiApi) await step('DPI', async () => {
    x.sensors = await x.dpiApi.sensors();
    const list = await x.dpiApi.list(0);
    x.steps = list.length ? list : Array.from({ length: 160 }, (_, i) => 100 + i * 50);
    Object.assign(x, await x.dpiApi.get(0));
  });
  x.rateApi = rateApi(d);
  if (x.rateApi) await step('回報率', async () => { x.rate = await x.rateApi.load(); });
  if (d.has(F.ONBOARD_PROFILES)) {
    await step('板載模式', async () => { x.onboardMode = (await d.call(F.ONBOARD_PROFILES, 2))[0]; });
    await step('板載設定檔', async () => { x.onboard = await readOnboard(d); });
  }
  if (d.has(F.FW_VERSION)) await step('韌體', async () => {
    x.fw = [];
    const n = (await d.call(F.FW_VERSION, 0))[0];
    for (let i = 0; i < n; i++) {
      const r = await d.call(F.FW_VERSION, 1, [i]);
      const prefix = String.fromCharCode(r[1], r[2], r[3]).replace(/\0/g, '').trim();
      x.fw.push(r[0] === 2 ? ['硬體版本', String(r[4])]
        : [`韌體 · ${FW_TYPES[r[0]] ?? r[0]}`, `${prefix} ${hx(r[4])}.${hx(r[5])}.B${hx((r[6] << 8) | r[7], 4)}`]);
    }
  });
  if (d.has(F.HIRES_WHEEL)) await step('滾輪', async () => { x.wheelMode = (await d.call(F.HIRES_WHEEL, 1))[0]; });
  const ss = d.has(F.SMART_SHIFT_ENH) ? F.SMART_SHIFT_ENH : d.has(F.SMART_SHIFT) ? F.SMART_SHIFT : null;
  if (ss) await step('SmartShift', async () => { x.smart = { fid: ss, r: await d.call(ss, ss === F.SMART_SHIFT_ENH ? 1 : 0) }; });
  if (d.has(F.CHANGE_HOST)) await step('Easy-Switch', async () => { const r = await d.call(F.CHANGE_HOST, 0); x.hosts = { n: r[0], cur: r[1] }; });
  if (d.has(F.REPROG_V4)) await step('按鍵列表', async () => {
    x.controls = [];
    const n = (await d.call(F.REPROG_V4, 0))[0];
    for (let i = 0; i < n; i++) {
      const r = await d.call(F.REPROG_V4, 1, [i]);
      x.controls.push({ cid: (r[0] << 8) | r[1], flags: r[4] | (r[8] << 8) });
    }
  });
  // DPI 檔位（存在瀏覽器裡，對應 G HUB 主機模式的做法）
  const key = 'stages:' + d.name;
  x.stages = store.get(key, null);
  if (!x.stages) {
    const base = x.onboard?.profile?.resolutions?.filter(Boolean);
    const vals = base?.length ? base : [x.cur || 800, 1200, 1600, 2400, 3200];
    x.stages = { list: [0, 1, 2, 3, 4].map(i => ({ dpi: vals[i] || [800, 1200, 1600, 2400, 3200][i], on: i === 0 || !!base?.[i] })), active: 0 };
    if (x.cur && !base?.length) x.stages.list[0].dpi = x.cur;
  }
  const match = x.stages.list.findIndex(s => s.on && s.dpi === x.cur);
  if (match >= 0) x.stages.active = match;
  x.saveStages = () => store.set(key, x.stages);
}

// ───────────────────────── 應用程式狀態與連線 ─────────────────────────
let hidDev = null, transport = null, devices = [], current = null, section = 'dpi';

$('#btnConnect').onclick = connect;
$('#btnDisconnect').onclick = disconnect;
$('#btnClearLog').onclick = () => { logEl.textContent = ''; };
$('#btnLog').onclick = () => { $('#drawer').hidden = !$('#drawer').hidden; };

function checkSupport() {
  if (!('hid' in navigator)) {
    notice('此瀏覽器不支援 <b>WebHID</b>。請使用桌面版 <b>Chrome、Edge 或 Opera</b>（89 版以上）；Firefox 與 Safari 目前不支援。', 'err');
    $('#btnConnect').disabled = true;
    return false;
  }
  if (!window.isSecureContext) {
    notice('WebHID 只能在安全環境使用：請用 <code>https://</code> 或 <code>http://localhost</code> 開啟此頁面。', 'err');
    $('#btnConnect').disabled = true;
    return false;
  }
  return true;
}

async function connect() {
  try {
    const list = await navigator.hid.requestDevice({ filters: HID_FILTERS });
    if (list.length) await openHid(list);
  } catch (e) { log('連線失敗：' + e.message, 'l-err'); }
}
function pickHidpp(list) {
  return list.find(d => d.collections.some(c => c.usagePage === 0xff00 || c.usagePage === 0xff43)) || list[0];
}
async function openHid(list) {
  await disconnect();
  hidDev = pickHidpp(list);
  setStatus('開啟中…');
  try {
    if (!hidDev.opened) await hidDev.open();
  } catch (e) {
    log(`無法開啟裝置：${e.message}`, 'l-err');
    notice('無法開啟裝置。請先完全關閉 G HUB／Options+／Solaar（包含系統匣圖示）再試一次；Linux 需設定 hidraw 權限（見 README）。', 'err');
    setStatus('未連線'); hidDev = null; render();
    return;
  }
  transport = new HidppTransport(hidDev);
  transport.listeners.add(onNotification);
  $('#btnDisconnect').disabled = false;
  log(`已開啟：${hidDev.productName}（VID ${hx(hidDev.vendorId, 4)} / PID ${hx(hidDev.productId, 4)}）`, 'l-ok');
  await discover();
}
async function disconnect() {
  if (transport) transport.close();
  if (hidDev?.opened) { try { await hidDev.close(); } catch {} }
  hidDev = null; transport = null; devices = []; current = null;
  $('#btnDisconnect').disabled = true;
  setStatus('未連線');
  render();
}
navigator.hid?.addEventListener('disconnect', (e) => {
  if (e.device === hidDev) { log('裝置已拔除', 'l-err'); disconnect(); }
});

async function probe(index, timeout) {
  try {
    const r = await transport.request(index, 0, 1, [0, 0, 0x5a], timeout);
    if (r[0] < 2) { log(`索引 ${hx(index)}：HID++ ${r[0]}.${r[1]}（不支援的舊協定）`, 'l-err'); return null; }
    return new LogiDevice(transport, index, `${r[0]}.${r[1]}`);
  } catch (e) {
    if (e.kind === 'hidpp10' && index === 0xff) log('此為接收器，開始掃描已配對裝置…');
    else if (index !== 0xff) log(`槽位 ${index}：${e.message}`);
    return null;
  }
}
let scanning = false;
async function discover() {
  if (!transport || scanning) return;
  scanning = true;
  setStatus('偵測裝置中…');
  devices = []; current = null;
  render();
  const looksLikeReceiver = RECEIVER_PIDS.has(hidDev.productId) || /receiver|unifying|bolt|lightspeed/i.test(hidDev.productName);
  if (!looksLikeReceiver) { const d = await probe(0xff, 1500); if (d) devices.push(d); }
  if (!devices.length) for (let i = 1; i <= 6; i++) { const d = await probe(i, 700); if (d) devices.push(d); }
  for (const d of devices) {
    try { await d.loadFeatures(); await d.readName(); d.battery = await loadBattery(d).catch(() => null); }
    catch (e) { log(`讀取 ${d.name} 失敗：${e.message}`, 'l-err'); }
  }
  scanning = false;
  setStatus(hidDev ? hidDev.productName : '未連線');
  render();
}

function onNotification(d) {
  if (d[1] === 0x41 && d[0] >= 1 && d[0] <= 6) {
    log(`接收器通知：槽位 ${d[0]} ${d[3] & 0x40 ? '中斷連線' : '已連線'}`, 'l-ev');
    return;
  }
  const dev = devices.find(x => x.index === d[0]);
  const f = dev?.featList.find(x => x.index === d[1]);
  if (f) log(`事件：${dev.name} → ${FEATURE_NAMES[f.id] || hx(f.id, 4)} ${bytesHex(d.slice(2, 8))}`, 'l-ev');
}

async function openDevice(d) {
  current = d;
  setStatus(`${hidDev.productName} → ${d.name}`);
  render();
  await loadAll(d);
  if (current === d) render();
}

// ───────────────────────── 畫面 ─────────────────────────
function render() {
  const app = $('#app');
  if (current) return app.replaceChildren(...renderDevice(current));
  app.replaceChildren(renderHome());
}

function renderHome() {
  if (scanning) return h('div', { class: 'home' }, h('div', { class: 'empty-hero' }, h('div', { class: 'art' }, mouseArt()), h('h2', null, '正在偵測裝置…'), h('p', null, '如果透過無線接收器連線，動一下滑鼠可以喚醒它。')));
  if (!hidDev) {
    return h('div', { class: 'home' }, h('div', { class: 'empty-hero' },
      h('div', { class: 'art' }, mouseArt()),
      h('h2', null, '在瀏覽器裡調整你的羅技裝置'),
      h('p', null, '按下「連線裝置」，選擇滑鼠、鍵盤或 USB 接收器。不需要安裝任何驅動程式。'),
      h('button', { class: 'btn primary', onclick: connect, disabled: !('hid' in navigator) }, '連線裝置'),
      h('div', { class: 'chips' }, ['DPI 檔位', '回報率', '離地高度', '按鍵配置檢視', '滾輪', 'Easy-Switch'].map(t => h('span', { class: 'chip' }, t))),
      h('p', { class: 'hint' }, '使用前請先完全關閉 G HUB 或 Options+，否則它們會覆蓋這裡的設定。')));
  }
  if (!devices.length) {
    return h('div', { class: 'home' }, h('div', { class: 'empty-hero' },
      h('div', { class: 'art' }, mouseArt()),
      h('h2', null, '找不到可用的裝置'),
      h('p', null, '若使用無線接收器，先動一下滑鼠或按任一鍵喚醒裝置，再重新掃描。'),
      h('button', { class: 'btn primary', onclick: discover }, '重新掃描')));
  }
  return h('div', { class: 'home' },
    h('div', { class: 'home-grid' }, devices.map(d => {
      const b = d.battery;
      return h('button', { class: 'devcard', onclick: () => openDevice(d) },
        h('h3', null, d.name),
        h('div', { class: 'meta' }, b ? [b.text, batteryIcon(b.pct)] : null,
          h('span', { style: 'font:500 12.5px var(--body)' }, d.index === 0xff ? '直接連線' : `接收器槽位 ${d.index}`)),
        h('div', { class: 'art' }, mouseArt()),
        h('div', { class: 'foot' }, h('span', null, (DEVICE_TYPES[d.type] ?? '裝置') + ' · HID++ ' + d.proto), h('span', null, '進入設定 →')));
    })),
    h('button', { class: 'btn ghost sm', onclick: discover }, '↻ 重新掃描接收器'));
}

const SECTIONS = [
  { id: 'dpi', label: '靈敏度', icon: 'dpi' },
  { id: 'buttons', label: '按鍵配置', icon: 'buttons' },
  { id: 'wheel', label: '滾輪', icon: 'wheel' },
  { id: 'adv', label: '進階 / HITS', icon: 'adv' },
];

function renderDevice(d) {
  const x = d.data;
  const b = x?.battery || d.battery;
  const head = h('div', { class: 'devhead' },
    h('button', { class: 'icon-btn', title: '回到裝置列表', 'aria-label': '回到裝置列表', onclick: () => { current = null; render(); } }, svgEl(ICONS.back)),
    h('h1', null, d.name),
    b ? h('span', { class: 'batt' }, b.text, batteryIcon(b.pct)) : null);
  if (!x) return [head, h('div', { class: 'home' }, h('p', { class: 'hint' }, '讀取裝置設定中…'))];
  const rail = h('nav', { class: 'rail', 'aria-label': '設定分類' },
    SECTIONS.map(s => h('button', { class: section === s.id ? 'on' : '', 'aria-label': s.label, onclick: () => { section = s.id; render(); } }, svgEl(ICONS[s.icon]), h('span', null, s.label))),
    h('div', { class: 'sp' }),
    h('button', { class: section === 'info' ? 'on' : '', 'aria-label': '裝置資訊', onclick: () => { section = 'info'; render(); } }, svgEl(ICONS.info), h('span', null, '裝置資訊')));
  const [side, stage] = ({ dpi: viewDpi, buttons: viewButtons, wheel: viewWheel, adv: viewAdv, info: viewInfo }[section] || viewDpi)(d, x);
  const body = h('div', { class: 'devbody' }, rail);
  if (side) body.append(h('aside', { class: 'side' }, side));
  const st = h('section', { class: side ? 'stage' : 'stage full' }, stage);
  body.append(st);
  return [head, body];
}

// ── 靈敏度 ──
function viewDpi(d, x) {
  const side = h('div');
  side.append(h('h2', null, '靈敏度'),
    h('p', null, '設定最多 5 個 DPI 檔位，點選檔位編號即可切換。檔位存在這個瀏覽器裡，選中的檔位會即時寫入滑鼠。'));
  if (x.onboardMode === 1) {
    side.append(h('div', { class: 'group' }, h('div', { class: 'warnbox' },
      h('div', null, '滑鼠目前使用「內建記憶體模式」，板載設定檔可能會蓋掉這裡的 DPI 與回報率。'),
      h('div', null, h('button', { class: 'btn sm primary', onclick: (e) => guard(e.target, async () => { await d.call(F.ONBOARD_PROFILES, 1, [2]); x.onboardMode = 2; toast('已切換到主機模式'); render(); }) }, '切換到主機模式')))));
  }
  const prof = x.onboard?.profile;
  if (prof?.resolutions?.some(Boolean)) {
    side.append(h('div', { class: 'group' },
      h('div', { class: 'label' }, `板載設定檔 ${prof.index}${prof.name ? ' · ' + prof.name : ''}`),
      h('div', { class: 'okbox' }, prof.resolutions.filter(Boolean).join(' / ') + ' DPI'),
      h('button', { class: 'btn sm', onclick: () => {
        prof.resolutions.forEach((v, i) => { x.stages.list[i] = { dpi: v || x.stages.list[i].dpi, on: !!v }; });
        x.stages.active = Math.min(prof.defaultIndex, 4); x.saveStages(); render(); toast('已匯入板載設定檔的 DPI 檔位');
      } }, '匯入這組檔位')));
  }
  if (x.def) side.append(h('div', { class: 'group' }, h('div', { class: 'label' }, '感測器預設值'), h('div', { class: 'hint' }, `原廠預設 ${x.def} DPI`)));

  if (!x.dpiApi || !x.steps) return [side, h('div', null, h('div', { class: 'stagehead' }, h('h2', null, 'DPI 檔位')), h('p', { class: 'hint' }, '這個裝置沒有提供可調整的 DPI。'))];

  const steps = x.steps, lo = steps[0], hi = steps[steps.length - 1];
  const nearestIdx = (v) => steps.reduce((bi, s, i) => Math.abs(s - v) < Math.abs(steps[bi] - v) ? i : bi, 0);
  const readout = h('b', { id: 'dpiReadout' }, x.cur);
  const applyDpi = async (v) => {
    await x.dpiApi.set(x.sensor, v);
    const now = await x.dpiApi.get(x.sensor);
    Object.assign(x, now);
    const ro = $('#dpiReadout'); if (ro) ro.textContent = now.cur;
    log(`DPI 已設為 ${now.cur}`, 'l-ok');
  };
  const rows = x.stages.list.map((s, i) => {
    const active = x.stages.active === i;
    const row = h('div', { class: `stagerow${active ? ' active' : ''}${s.on ? '' : ' off'}` });
    const num = h('input', { type: 'number', min: lo, max: hi, value: s.dpi, 'aria-label': `檔位 ${i + 1} DPI`, disabled: !s.on });
    const range = h('input', { type: 'range', min: 0, max: steps.length - 1, value: nearestIdx(s.dpi), 'aria-label': `檔位 ${i + 1} 滑桿`, disabled: !s.on });
    const commit = (v) => {
      v = steps[nearestIdx(v)];
      s.dpi = v; num.value = v; range.value = nearestIdx(v); x.saveStages();
      if (x.stages.active === i) guard(null, () => applyDpi(v));
    };
    range.oninput = () => { num.value = steps[range.value]; };
    range.onchange = () => commit(steps[range.value]);
    num.onchange = () => commit(+num.value);
    const pick = h('button', { class: 'num', title: '切換到這個檔位', disabled: !s.on, onclick: () => {
      x.stages.active = i; x.saveStages(); render(); guard(null, () => applyDpi(s.dpi).then(() => toast(`已切換到檔位 ${i + 1}（${s.dpi} DPI）`)));
    } }, i + 1);
    const toggle = sw(s.on, (e) => {
      if (!e.target.checked && active) { e.target.checked = true; toast('使用中的檔位不能停用，請先切換到其他檔位'); return; }
      s.on = e.target.checked; x.saveStages(); render();
    });
    row.append(h('span', { class: 'bar' }), pick, range, num, toggle);
    return row;
  });

  const stage = h('div', null,
    h('div', { class: 'stagehead' }, h('h2', null, 'DPI 檔位'), h('div', { class: 'readout' }, '滑鼠目前', readout, 'DPI')),
    h('div', { class: 'cols' }, h('span'), h('span', null, '檔位'), h('span', null, `${lo} – ${hi}`), h('span', null, 'DPI'), h('span', null, '啟用')),
    rows);

  if (x.rate) {
    const sel = selectOf(x.rate.options.slice().sort((a, b) => b.hz - a.hz).map(o => ({ v: o.v, t: `${o.hz} Hz` })), x.rate.cur,
      () => guard(sel, async () => { await x.rateApi.set(+sel.value); x.rate.cur = +sel.value; toast(`回報率已設為 ${sel.selectedOptions[0].text}`); log(`回報率 → ${sel.selectedOptions[0].text}`, 'l-ok'); }));
    stage.append(h('div', { class: 'subsec' }, h('div', { class: 'label' }, d.index === 0xff ? '回報率' : '無線回報率'), sel,
      h('div', { class: 'hint' }, '越高越即時，但耗電也越多。')));
  }
  if (x.dpiApi.hasLod(x.sensor)) {
    const sel = selectOf(LOD_NAMES.map((t, i) => ({ v: i, t })), x.lod ?? 1,
      () => guard(sel, async () => { await x.dpiApi.set(x.sensor, x.cur, +sel.value); x.lod = +sel.value; toast(`離地高度已設為「${LOD_NAMES[sel.value]}」`); }));
    stage.append(h('div', { class: 'subsec' }, h('div', { class: 'label' }, '離地高度 (LOD)'), sel,
      h('div', { class: 'hint' }, '滑鼠抬離桌面多高時停止追蹤。習慣常拿起滑鼠的人可選「低」。')));
  }
  return [side, stage];
}

// ── 按鍵配置 ──
function viewButtons(d, x) {
  const prof = x.onboard?.supported ? x.onboard.profile : null;
  const btn = (i) => prof?.buttons?.[i] ? describeButton(prof.buttons[i]) : null;
  const parts = [
    ['left', '左鍵', 0, '左鍵點擊'], ['right', '右鍵', 1, '右鍵點擊'], ['middle', '中鍵', 2, '中鍵點擊'],
    ['backbtn', '側鍵（後）', 3, '後退'], ['forward', '側鍵（前）', 4, '前進'],

  const box = h('div', { class: 'mousebox' }, mouseCallouts(labels, sel));

      h('div', { class: 'btnlist' }, prof.buttons.map((b, i) => {
        const part = parts.find(p => p[2] === i);
        return h('button', { class: part && part[0] === sel ? 'on' : '', onclick: () => { if (part) { viewButtons.sel = part[0]; render(); } } },
          h('span', null, part ? part[1] : `按鍵 ${i + 1}`), h('small', null, describeButton(b)));
      })),
      prof.gbuttons.length ? h('div', { class: 'group' }, h('div', { class: 'label' }, 'G-Shift 層'),
        h('div', { class: 'btnlist' }, prof.gbuttons.map((b, i) => h('button', null, h('span', null, `按鍵 ${i + 1}`), h('small', null, describeButton(b)))))) : null);
  } else {
    side.append(h('p', null, '右圖為預設配置。'),
      h('div', { class: 'warnbox' }, x.onboard
        ? `這個裝置的板載設定檔格式（版本 ${x.onboard.info.format}）還無法解析，所以讀不到自訂的按鍵配置。`
        : '這個裝置沒有板載設定檔功能。'));
  }
  if (x.controls?.length) {
    side.append(h('div', { class: 'group' }, h('div', { class: 'label' }, `可程式按鍵（${x.controls.length}）`),
      h('div', { class: 'btnlist' }, x.controls.map(c => h('button', null, h('span', null, CID_NAMES[c.cid] || `CID 0x${hx(c.cid, 4)}`),
        h('small', null, [c.flags & 0x10 ? '可重新指派' : '', c.flags & 0x20 ? '可轉送' : ''].filter(Boolean).join('、')))))));
  }
  side.append(h('div', { class: 'group' }, h('div', { class: 'hint' }, '修改按鍵需要寫入滑鼠的板載記憶體。寫錯可能讓設定檔失效，所以這個功能還在開發，目前不會寫入任何資料。')));
  return [side, box];
}

// ── 滾輪 ──
function viewWheel(d, x) {
  const side = h('div', null, h('h2', null, '滾輪'));
  let any = false;
  if (x.wheelMode != null) {
    any = true;
    const m = x.wheelMode;
    const apply = (bits) => guard(null, async () => {
      const next = (x.wheelMode & ~1 & ~bits.mask) | bits.val;  // bit0（轉送給 HID++）永遠清除
      await d.call(F.HIRES_WHEEL, 2, [next]); x.wheelMode = next; toast('滾輪設定已套用');
    });
    side.append(h('div', { class: 'group' },
      h('div', { class: 'toggle-row' }, '高解析度捲動', sw(!!(m & 2), (e) => apply({ mask: 2, val: e.target.checked ? 2 : 0 }))),
      h('div', { class: 'hint' }, '每一格切得更細，捲動更平滑。'),
      h('div', { class: 'toggle-row' }, '反向捲動', sw(!!(m & 4), (e) => apply({ mask: 4, val: e.target.checked ? 4 : 0 })))));
  }
  if (x.smart) {
    any = true;
    const { fid, r } = x.smart;
    const setFn = fid === F.SMART_SHIFT_ENH ? 2 : 1;
    const auto = r[1] > 0 && r[1] < 0xff;
    const thr = h('input', { type: 'range', min: 1, max: 50, value: auto ? Math.min(r[1], 50) : 10, disabled: !auto });
    const modeSel = selectOf([{ v: 2, t: '段落感 (Ratchet)' }, { v: 1, t: '自由滾動 (Free-spin)' }], r[0] === 1 ? 1 : 2,
      () => guard(modeSel, async () => { await d.call(fid, setFn, [+modeSel.value, 0, 0]); r[0] = +modeSel.value; toast('滾輪模式已套用'); }));
    thr.onchange = () => guard(thr, async () => { await d.call(fid, setFn, [0, +thr.value, 0]); r[1] = +thr.value; toast(`SmartShift 靈敏度：${thr.value}`); });
    side.append(h('div', { class: 'group' },
      h('div', { class: 'label' }, 'SmartShift'), modeSel,
      h('div', { class: 'toggle-row' }, '快速撥動時自動切換', sw(auto, (e) => guard(null, async () => {
        const v = e.target.checked ? +thr.value : 0xff; await d.call(fid, setFn, [0, v, 0]); r[1] = v; render();
      }))), thr, h('div', { class: 'hint' }, '數值越小，越容易切換成自由滾動。')));
  }
  if (!any) {
    side.append(h('p', null, '這個裝置沒有提供公開的滾輪設定協定。'),
      h('div', { class: 'warnbox' }, 'PRO X2 SUPERSTRIKE 的 BHOP 模式使用羅技尚未公開的新協定，目前還無法支援。請到「進階 / HITS」查看偵測到的未知功能。'));
  }
  return [side, h('div', { class: 'mousebox' }, mouseCallouts({ middle: { title: '滾輪', sub: '' } }, 'middle'))];
}

// ── 進階 / HITS ──
function viewAdv(d, x) {
  const unknown = d.featList.filter(f => !FEATURE_NAMES[f.id]);
  const side = h('div', null, h('h2', null, '進階 / HITS'),
    h('p', null, 'HITS（觸發點、快速觸發、點擊觸覺回饋）與 BHOP 是新款滑鼠才有的功能，羅技沒有公開這些協定。'),
    h('p', null, '右邊列出這個裝置回報、但目前還不認識的功能。它們很可能就是 HITS 與 BHOP 的控制介面。把這張表傳給開發者，可以協助逆向分析這些協定。'),
    h('div', { class: 'warnbox' }, '請不要對未知功能送出寫入指令，可能會讓滑鼠進入異常狀態。'));
  const fid = h('input', { class: 'field mono', value: unknown[0] ? hx(unknown[0].id, 4) : '0001', 'aria-label': 'Feature ID（16 進位）', style: 'width:110px;font-size:15px' });
  const fn = h('input', { class: 'field mono', type: 'number', min: 0, max: 15, value: 0, 'aria-label': 'Function 編號', style: 'width:80px;font-size:15px' });
  const params = h('input', { class: 'field mono', value: '', placeholder: '參數，例如 00 01', 'aria-label': '參數', style: 'flex:1;min-width:140px;font-size:15px' });
  const out = h('pre', { class: 'mono okbox', style: 'margin:10px 0 0;min-height:40px;white-space:pre-wrap' }, '');
  const stage = h('div', null,
    h('div', { class: 'stagehead' }, h('h2', null, '未知功能'), h('span', { class: 'readout' }, `${unknown.length} 項`)),
    unknown.length
      ? h('div', { class: 'tablewrap' }, h('table', null, h('tr', null, h('th', null, '索引'), h('th', null, 'Feature ID'), h('th', null, '版本'), h('th', null, '旗標')),
        unknown.map(f => h('tr', null, h('td', { class: 'mono' }, hx(f.index)), h('td', { class: 'mono' }, '0x' + hx(f.id, 4)), h('td', { class: 'mono' }, 'v' + f.version),
          h('td', null, [f.type & 0x40 ? '隱藏' : '', f.type & 0x20 ? '工程用' : '', f.type & 0x80 ? '已淘汰' : ''].filter(Boolean).join('、'))))))
      : h('p', { class: 'hint' }, '這個裝置的所有功能都已辨識。'),
    h('div', { class: 'row', style: 'margin-top:12px' },
      h('button', { class: 'btn sm', onclick: async (e) => {
        const text = `${d.name}\n` + d.featList.map(f => `${hx(f.index)} 0x${hx(f.id, 4)} v${f.version} type=${hx(f.type)} ${FEATURE_NAMES[f.id] || '?'}`).join('\n');
        try { await navigator.clipboard.writeText(text); toast('已複製完整功能清單'); } catch { out.textContent = text; }
      } }, '複製完整功能清單')),
    h('div', { class: 'subsec', style: 'max-width:none' },
      h('div', { class: 'label' }, '送出原始 HID++ 指令（唯讀查詢用）'),
      h('div', { class: 'row' }, 'Feature', fid, 'Fn', fn, params,
        h('button', { class: 'btn sm primary', onclick: (e) => guard(e.target, async () => {
          const id = parseInt(fid.value, 16);
          const ps = params.value.trim() ? params.value.trim().split(/[\s,]+/).map(v => parseInt(v, 16) & 0xff) : [];
          if (Number.isNaN(id) || ps.some(Number.isNaN)) throw new Error('格式錯誤，請輸入 16 進位數值');
          try { out.textContent = bytesHex(await d.call(id, +fn.value, ps)); } catch (err) { out.textContent = '錯誤：' + err.message; }
        }) }, '送出')),
      out));
  return [side, stage];
}

// ── 裝置資訊 ──
function viewInfo(d, x) {
  const rows = [['名稱', d.name], ['類型', DEVICE_TYPES[d.type] ?? '—'], ['協定', 'HID++ ' + d.proto],
    ['連線', d.index === 0xff ? '直接 (USB / 藍牙)' : `接收器槽位 ${d.index}`],
    ['USB', `${hidDev.productName} · ${hx(hidDev.productId, 4)}`], ...(x.fw || [])];
  const cards = [h('div', { class: 'card' }, h('h3', null, '裝置'), h('dl', { class: 'kv' }, rows.map(([k, v]) => [h('dt', null, k), h('dd', null, v)])))];
  if (x.battery) {
    const p = x.battery.pct;
    cards.push(h('div', { class: 'card' }, h('h3', null, '電池'), h('div', { class: 'big' }, x.battery.text),
      p != null ? h('div', { class: 'meter' }, h('i', { style: `width:${p}%;background:${p <= 15 ? 'var(--err)' : p <= 30 ? 'var(--warn)' : 'var(--ok)'}` })) : null,
      h('div', { class: 'hint', style: 'margin-top:8px' }, x.battery.extra)));
  }
  if (x.onboardMode != null) {
    const set = (m) => guard(null, async () => { await d.call(F.ONBOARD_PROFILES, 1, [m]); x.onboardMode = (await d.call(F.ONBOARD_PROFILES, 2))[0]; render(); toast(m === 1 ? '已切換到內建記憶體模式' : '已切換到主機模式'); });
    cards.push(h('div', { class: 'card' }, h('h3', null, '板載設定檔', h('small', null, '0x8100')),
      h('div', { class: 'seg' }, h('button', { class: x.onboardMode === 1 ? 'on' : '', onclick: () => set(1) }, '內建記憶體'), h('button', { class: x.onboardMode === 2 ? 'on' : '', onclick: () => set(2) }, '主機模式')),
      h('p', { class: 'hint' }, '內建記憶體：使用存在滑鼠裡的設定，換電腦也一樣。主機模式：由這個網頁（或 G HUB）控制，斷電後會還原。'),
      x.onboard ? h('div', { class: 'hint' }, `格式 v${x.onboard.info.format} · ${x.onboard.info.count} 組設定檔 · 每組 ${x.onboard.info.size} bytes`) : null));
  }
  if (x.hosts) {
    cards.push(h('div', { class: 'card' }, h('h3', null, 'Easy-Switch', h('small', null, '0x1814')),
      h('div', { class: 'seg' }, Array.from({ length: x.hosts.n }, (_, i) => h('button', { class: i === x.hosts.cur ? 'on' : '', onclick: async () => {
        if (i === x.hosts.cur || !confirm(`切換到主機 ${i + 1}？裝置會立即與這台電腦中斷連線。`)) return;
        try { await d.call(F.CHANGE_HOST, 1, [i], 600); } catch {}
        toast(`已切換到主機 ${i + 1}`);
      } }, `主機 ${i + 1}`)))));
  }
  cards.push(h('div', { class: 'card wide' }, h('h3', null, `支援的功能（${d.featList.length}）`),
    h('div', { class: 'tablewrap' }, h('table', null,
      h('tr', null, h('th', null, '索引'), h('th', null, 'Feature ID'), h('th', null, '名稱'), h('th', null, '版本')),
      d.featList.map(f => h('tr', null, h('td', { class: 'mono' }, hx(f.index)), h('td', { class: 'mono' }, '0x' + hx(f.id, 4)),
        h('td', null, FEATURE_NAMES[f.id] || h('span', { class: 'tag' }, '未知')), h('td', { class: 'mono' }, 'v' + f.version)))))));
  return [null, h('div', { class: 'cards' }, cards)];
}

// ───────────────────────── 啟動 ─────────────────────────
render();
(async () => {
  if (!checkSupport()) return;
  const granted = (await navigator.hid.getDevices()).filter(d => d.vendorId === LOGI_VID);
  if (granted.length) {
    log(`找到已授權的裝置：${granted[0].productName}，自動連線中…`);
    await openHid(granted);
  }
})();
</script>
</body>
</html>
